name: CI

on:
  push:
  pull_request:
  # Manual trigger, so a run can be retried without an empty commit. Note a
  # startup_failure run cannot be re-run at all, which is what this avoids.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# A same-repository PR is already covered by its push event. Fork PRs have no
# corresponding push in this repository, so their pull_request jobs still run.
jobs:
  python:
    name: Python 3.11
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt --requirement requirements-dev.txt

      - name: Install locked Steam runtime dependencies
        run: npm ci --ignore-scripts --omit=dev

      - name: Prove x86_64 runtime wheels are available
        run: >-
          python -m pip download --only-binary=:all:
          --requirement requirements.txt
          --dest "$RUNNER_TEMP/runtime-wheels"

      - name: Import the application on Linux
        env:
          SWEEPY_SKIP_STARTUP_GEN: "1"
        run: python -c "from main import app"

      - name: Exercise real POSIX permission bits
        run: python -m pytest -q tests/test_state_root_invariants.py::test_private_helpers_create_0700_directories_and_0600_files

      - name: Run Python tests
        env:
          SWEEPY_SKIP_STARTUP_GEN: "1"
        run: python -m pytest -q

      - name: Run flake8
        run: python -m flake8

      - name: Run mypy
        run: python -m mypy career_bot backend uma_api uma_data integrations main.py core

      - name: Import with a read-only checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0

          state_root="$(mktemp -d)"
          restore() {
            chmod -R u+w "$GITHUB_WORKSPACE"
            rm -rf "$state_root"
          }
          trap restore EXIT

          chmod -R a-w "$GITHUB_WORKSPACE"
          if ( : > "$GITHUB_WORKSPACE/.ci-write-probe" ) 2>/dev/null; then
            rm -f "$GITHUB_WORKSPACE/.ci-write-probe"
            echo "checkout write probe unexpectedly succeeded" >&2
            exit 1
          fi

          mkdir -p \
            "$state_root/runtime" \
            "$state_root/xdg-state" \
            "$state_root/xdg-data" \
            "$state_root/home"
          cd "$state_root"
          env -u SWEEPY_SKIP_STARTUP_GEN \
            HOME="$state_root/home" \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH="$GITHUB_WORKSPACE" \
            UMA_RUNTIME_DIR="$state_root/runtime" \
            XDG_DATA_HOME="$state_root/xdg-data" \
            XDG_STATE_HOME="$state_root/xdg-state" \
            python -c "from main import app"

  frontend:
    name: Frontend
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run frontend tests
        run: npm --prefix frontend test

      - name: Build frontend
        run: npm --prefix frontend run build

  container:
    name: Container build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build private local image
        run: docker build --tag manhattancafe-uma-auto:ci --file Dockerfile .
